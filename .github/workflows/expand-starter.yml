name: Expand MP7 Companion starter source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-starter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand starter archive into the repository
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .bootstrap ]; then
            echo "Starter archive already expanded; nothing to do."
            exit 0
          fi

          cat \
            .bootstrap/part00.b64 \
            .bootstrap/part01.b64 \
            .bootstrap/part02.b64 \
            .bootstrap/part03.b64 \
            .bootstrap/part04.b64 \
            .bootstrap/part05.b64 \
            .bootstrap/part06a.b64 \
            .bootstrap/part06b.b64 > /tmp/mp7-companion.zip.b64

          base64 --decode /tmp/mp7-companion.zip.b64 > /tmp/mp7-companion.zip
          mkdir -p /tmp/mp7-companion-unpacked
          unzip -q /tmp/mp7-companion.zip -d /tmp/mp7-companion-unpacked
          cp -a /tmp/mp7-companion-unpacked/mp7-companion-app/. .

          rm -rf .bootstrap
          rm -f /tmp/mp7-companion.zip.b64 /tmp/mp7-companion.zip
          rm -rf /tmp/mp7-companion-unpacked

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted files to commit."
          else
            git commit -m "build: expand MP7 Companion starter source"
            git push
          fi
